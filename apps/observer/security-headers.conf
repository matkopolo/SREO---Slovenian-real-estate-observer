# Response headers for every location. nginx drops all inherited add_header lines as soon as a location
# declares its own, so each location that adds a header includes this file instead of relying on the server block.
#
# CSP: everything is same-origin except the OpenFreeMap basemap (style, TileJSON, vector and raster tiles,
# sprites and glyphs all come from tiles.openfreemap.org). MapLibre decodes images from blob: URLs and may
# start its worker from a blob: URL; React/MapLibre set inline style attributes, hence 'unsafe-inline' for styles.
# Fonts are self-hosted (/fonts). frame-ancestors 'none' (and X-Frame-Options for old browsers) forbid framing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
