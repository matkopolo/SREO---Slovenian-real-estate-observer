# Per-client limit for the API proxy. The map fires a burst of a few dozen requests on every
# pan or zoom and then idles, so 30 requests/s sustained with a burst of 60 never touches a
# browser, while a scraper or a runaway client gets 429 instead of exhausting the API's ten
# database connections. Keyed by the connecting address: behind another reverse proxy, set
# real_ip_header/set_real_ip_from here or every user shares one bucket.
# One page load of the area explorer issues about 55 API requests within two seconds (lists, boundaries, rankings),
# so the burst must hold two or three such loads from one address; the rate itself stays modest.
limit_req_zone $binary_remote_addr zone=api_per_client:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Compression: text assets and API JSON (the boundaries response is ~2.4 MB raw). Brotli is not built into
    # the official nginx image, so gzip only.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json application/geo+json image/svg+xml;

    # Same-origin API: resolve the Compose service per request so API redeploys need no nginx restart.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        limit_req zone=api_per_client burst=150 nodelay;
        set $api http://real-estate-api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 35s; # the API's own write timeout is 30 s
        # The API may set its own copies; hide them so every response carries exactly one of each (the
        # snippet below adds ours).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Strict-Transport-Security;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The MCP server (streamable HTTP) at exactly /mcp: long-lived event streams, so no buffering
    # and a long read timeout (the server pings every 30 s); the same per-client rate limit as the API.
    location = /mcp {
        limit_req zone=api_per_client burst=150 nodelay;
        set $mcp http://sreo-mcp:8090;
        proxy_pass $mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Vite output: content-hashed file names, cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        # Module workers (MapLibre) must be served as JavaScript; nginx's default types lack .mjs.
        location ~* \.mjs$ {
            types { }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    # Self-hosted fonts: the file names carry the font package version, so they never change in place.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # robots.txt is a real file served as text/plain; never the SPA fallback (a missing file is a 404, not index.html).
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html and SPA routes: always revalidate, so a deploy is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
