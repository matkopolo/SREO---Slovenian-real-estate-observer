server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Compression: text assets and API JSON (the boundaries response is ~2.4 MB raw). Brotli is not built into
    # the official nginx image, so gzip only.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json application/geo+json image/svg+xml;

    # Same-origin API: resolve the Compose service per request so API redeploys need no nginx restart.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        set $api http://real-estate-api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 35s; # the API's own write timeout is 30 s
        # The API sets its own copies; hide them so every response carries exactly one of each.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite output: content-hashed file names, cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        # Module workers (MapLibre) must be served as JavaScript; nginx's default types lack .mjs.
        location ~* \.mjs$ {
            types { }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    # Self-hosted fonts: the file names carry the font package version, so they never change in place.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html and SPA routes: always revalidate, so a deploy is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
