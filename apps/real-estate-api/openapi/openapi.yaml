openapi: 3.1.0
info:
  title: SREO API
  version: 0.2.0
  description: >-
    Read-only API of SREO: analytics over GURS ETN sale and rental transactions with
    PostGIS geographies, SURS and Banka Slovenije context, and GURS construction sources.
    Every operation is a GET; there are no accounts or writes. Each request has a deadline
    (504 timeout when exceeded), and every response carries X-Request-ID.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Operations]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Operations]
      responses:
        "200":
          description: API and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/meta:
    get:
      operationId: getMetadata
      tags: [Metadata]
      responses:
        "200":
          description: Supported API dimensions and classifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metadata"
  /api/v1/data-status:
    get:
      operationId: getDataStatus
      tags: [Operations]
      responses:
        "200":
          description: Active analytical release and any newer release being prepared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatus"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/economy/inflation:
    get:
      operationId: getSlovenianInflation
      tags: [Economy]
      description: Annual CPI inflation rate from the official SURS SiStat H281S monthly table.
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/Interval"
      responses:
        "200":
          description: Slovenian annual inflation aggregated to the requested frequency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InflationSeries"
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v1/geographies:
    get:
      operationId: listGeographies
      tags: [Geographies]
      parameters:
        - $ref: "#/components/parameters/GeographyLevel"
        - name: parentId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Geographic units matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographyList"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/geographies/{id}/children:
    get:
      operationId: listGeographyChildren
      tags: [Geographies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Direct children of the geographic unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographyList"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/geographies/boundaries:
    get:
      operationId: listGeographyBoundaries
      tags: [Geographies]
      summary: Simplified boundaries of one level in one response (finer levels for a bounding box)
      description: >-
        Statistical regions and municipalities are returned for all of Slovenia (or a bbox). City districts,
        local communities and settlements require `bbox` (west,south,east,north). At most 1200 units are returned,
        nearest to the bbox centre first. Unsimplified outlines (`detail=full`) are served only per geography
        by /geographies/{id}/boundary.
      parameters:
        - name: level
          in: query
          required: true
          schema: { type: string, enum: [statistical_region, municipality, city_district, local_community, settlement] }
        - name: bbox
          in: query
          required: false
          description: Required for city_district, local_community and settlement.
          schema: { type: string, example: "14.40,45.98,14.62,46.12" }
        - name: detail
          in: query
          required: false
          schema: { type: string, enum: [low, medium], default: medium }
      responses:
        "200":
          description: GeoJSON FeatureCollection; properties are the geography units.
          content:
            application/geo+json:
              schema:
                type: object
                required: [type, features, count]
                properties:
                  type: { type: string, enum: [FeatureCollection] }
                  features: { type: array, items: { type: object } }
                  count: { type: integer }
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/geographies/{id}:
    get:
      operationId: getGeography
      tags: [Geographies]
      parameters:
        - $ref: "#/components/parameters/GeographyId"
      responses:
        "200":
          description: Geographic-unit metadata and WGS84 bounds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Geography"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/geographies/{id}/boundary:
    get:
      operationId: getGeographyBoundary
      tags: [Geographies]
      parameters:
        - $ref: "#/components/parameters/GeographyId"
        - name: detail
          in: query
          description: Topology-preserving simplification appropriate for the map zoom level.
          schema:
            type: string
            enum: [low, medium, full]
            default: medium
      responses:
        "200":
          description: Geographic boundary as a WGS84 GeoJSON Feature.
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/GeoJSONFeature"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/statistics/overview:
    get:
      operationId: getSaleStatisticsOverview
      tags: [Statistics]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/LandScope"
        - $ref: "#/components/parameters/StatisticsGeographyId"
      responses:
        "200":
          description: Sale statistics over the selected population.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsOverview"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/statistics/timeseries:
    get:
      operationId: getSaleStatisticsTimeSeries
      tags: [Statistics]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/LandScope"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: interval
          in: query
          schema:
            type: string
            enum: [month, quarter, year]
            default: year
      responses:
        "200":
          description: Periodic sale statistics over the selected population.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsTimeSeries"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/statistics/outliers:
    get:
      operationId: listSaleStatisticalOutliers
      tags: [Statistics]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/LandScope"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Auditable statistical market outliers; source observations remain stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutlierList"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/transactions/extremes:
    get:
      operationId: listTransactionExtremes
      tags: [Statistics]
      parameters:
        - name: transactionKind
          in: query
          schema:
            type: string
            enum: [sale, rent]
            default: sale
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/LandScope"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
      responses:
        "200":
          description: Lowest and highest representative transactions for the selected population.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionExtremeList"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/transactions/recent:
    get:
      operationId: listRecentTransactions
      tags: [Transactions]
      summary: Newest recorded agreements of an area with their address
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: transactionKind
          in: query
          required: false
          schema: { type: string, enum: [sale, rent], default: sale }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [date, price, perSqm, area], default: date }
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: street
          in: query
          required: false
          description: Only agreements with a part on this street (registered name, case-insensitive).
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: One page, newest first by default; `total` counts all matching agreements, `representative` tells whether one enters the statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentTransactions" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/rentals/statistics/overview:
    get:
      operationId: getRentalStatisticsOverview
      tags: [Rental Statistics]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/StatisticsGeographyId"
      responses:
        "200":
          description: Cleaned and raw monthly-rent statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalStatisticsOverview"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rentals/statistics/timeseries:
    get:
      operationId: getRentalStatisticsTimeSeries
      tags: [Rental Statistics]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: interval
          in: query
          schema:
            type: string
            enum: [month, quarter, year]
            default: year
      responses:
        "200":
          description: Rental trends with same-period prior-year comparisons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalStatisticsTimeSeries"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rentals/statistics/outliers:
    get:
      operationId: listRentalStatisticalOutliers
      tags: [Rental Statistics]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Auditable rental-price outliers; source observations remain stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalOutlierList"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rentals/map/clusters:
    get:
      operationId: getRentalMapClusters
      tags: [Rental Map]
      parameters:
        - $ref: "#/components/parameters/BoundingBox"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: zoom
          in: query
          schema: {type: integer, minimum: 0, maximum: 22, default: 8}
      responses:
        "200":
          description: Zoom-dependent rental clusters in the required bounding box.
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/GeoJSONFeatureCollection"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rentals/map/properties:
    get:
      operationId: getRentalMapProperties
      tags: [Rental Map]
      parameters:
        - $ref: "#/components/parameters/BoundingBox"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 250}
      responses:
        "200":
          description: Capped individual rental points in the required bounding box.
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/GeoJSONFeatureCollection"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rentals/map/geographies:
    get:
      operationId: getRentalMapGeographies
      tags: [Rental Map]
      parameters:
        - $ref: "#/components/parameters/BoundingBox"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: level
          in: query
          required: true
          schema: {type: string, enum: [country, statistical_region, municipality, city_district, local_community, settlement]}
      description: At most 1200 units are returned, the most active first.
      responses:
        "200":
          description: Rental summaries grouped by named geography.
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/GeoJSONFeatureCollection"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sales/transactions/{id}/history:
    get:
      operationId: getPropertyHistory
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Exact recorded component identities and explicitly weaker building geolocation references. Not an ownership register. At most 50 identities and 200 events per identity; truncation is explicit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyHistory"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sales/statistics/resales:
    get:
      operationId: getResaleSummary
      tags: [Statistics]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/GeographyId"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/LandScope"
      responses:
        "200":
          description: Days between observed comparable resales. Filters apply to the later sale; predecessors can predate the filter. Percentiles suppressed below 30 pairs. Not an owner holding-period estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResaleSummary"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/economy/inflation-factor:
    get:
      operationId: getInflationFactor
      tags: [Economy]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Approximate CPI adjustment chained from SURS monthly ratios after the first month through the last month. No overlapping annual rates or daily interpolation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InflationFactor"
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/affordability:
    get:
      operationId: getAffordability
      tags: [Economy]
      summary: Illustrative borrowing capacity per net-income band
      description: >-
        Combines SURS net wage percentiles for the area's municipality (Slovenia when
        unavailable), Banka Slovenije average rates on new housing loans, the dated
        Banka Slovenije DSTI and minimum-remaining-income limits, and the area's GURS ETN
        median EUR/m2 of the latest complete year. A statistical illustration, not a credit
        offer or a personal assessment.
      parameters:
        - name: geographyId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: propertyGroup
          in: query
          required: false
          schema: { type: string, enum: [apartment, house], default: apartment }
        - name: netIncome
          in: query
          required: false
          description: The user's own net monthly income (EUR); adds a `household` result.
          schema: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        - name: coBorrowerIncome
          in: query
          required: false
          description: A second borrower's net monthly income (EUR); requires netIncome. Limits apply per borrower.
          schema: { type: number, exclusiveMinimum: 0, maximum: 100000 }
      responses:
        "200":
          description: Inputs with their periods and sources, and one row per income band.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affordability"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/affordability/municipalities:
    get:
      operationId: listMunicipalAffordability
      tags: [Economy]
      summary: Median and mean earner's illustrative borrowing capacity for every municipality
      description: >-
        One response for all municipalities: SURS net wages by municipality of residence (Slovenia
        when unavailable), Banka Slovenije limits and average rates, and the municipality's GURS ETN
        median EUR/m2 pooled over fromYear–toYear with its representative sample size.
      parameters:
        - name: propertyGroup
          in: query
          required: false
          schema: { type: string, enum: [apartment, house], default: apartment }
        - name: fromYear
          in: query
          required: false
          schema: { type: integer, minimum: 2007 }
        - name: toYear
          in: query
          required: false
          schema: { type: integer, minimum: 2007 }
      responses:
        "200":
          description: One item per municipality.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MunicipalAffordability" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/demographics:
    get:
      operationId: getDemographics
      tags: [Economy]
      summary: SURS demographic and housing-stock context for Slovenia, a statistical region or a municipality
      description: >-
        Population by five-year age group (1 January), net migration, register-census dwellings,
        tenure and households, and a modelled yearly estimate of dwellings potentially released by
        owners aged 65+ who live alone (age-specific regional death rates × national living-alone
        shares × the area's owner-occupied share). The estimate is context, not a forecast of listings or prices.
      parameters:
        - name: geographyId
          in: query
          required: false
          description: Omit for Slovenia.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Demographic profile with sources and the release-estimate caveat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemographicsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/demographics/municipalities:
    get:
      operationId: listMunicipalDemographics
      tags: [Economy]
      summary: Demographic indicators for every municipality in one response
      responses:
        "200":
          description: One item per municipality.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MunicipalDemographicsResponse" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/map/buildings:
    get:
      operationId: getMapBuildings
      tags: [Map]
      summary: Recorded agreements grouped by building inside a bounding box
      description: >-
        One item per building (cadastral municipality code + building number) with the number of
        agreements in the period and the median EUR/m2 (sales) or monthly EUR/m2 (rentals) of the
        representative agreements. Busiest buildings first.
      parameters:
        - $ref: "#/components/parameters/BoundingBox"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: transactionKind
          in: query
          required: false
          schema: { type: string, enum: [sale, rent], default: sale }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 5000, default: 2000 }
      responses:
        "200":
          description: Building aggregates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapBuildingsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/construction/summary:
    get:
      operationId: getConstructionSummary
      tags: [Construction]
      summary: Registered buildings by year built and SURS permits for an area
      description: >-
        Registered GURS buildings are completed or measurable buildings, not construction in
        progress. SURS permits are counts per municipality and year.
      parameters:
        - name: geographyId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: fromYear
          in: query
          required: false
          schema: { type: integer, minimum: 1900 }
        - name: toYear
          in: query
          required: false
          schema: { type: integer, minimum: 1900 }
        - name: withDwellings
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Summary with its sources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionSummaryResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/construction/map:
    get:
      operationId: getConstructionMap
      tags: [Construction]
      summary: Municipality aggregates (zoom < 12) or registered building points (zoom ≥ 12)
      parameters:
        - name: geographyId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: fromYear
          in: query
          required: false
          schema: { type: integer, minimum: 1900 }
        - name: toYear
          in: query
          required: false
          schema: { type: integer, minimum: 1900 }
        - name: withDwellings
          in: query
          required: false
          schema: { type: boolean }
        - name: bbox
          in: query
          required: true
          schema: { type: string }
        - name: zoom
          in: query
          required: true
          schema: { type: number, minimum: 0, maximum: 22 }
      responses:
        "200":
          description: At most 300 municipalities or 3000 buildings; `truncated` marks a cut list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionMapResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/construction/buildings/{eid}:
    get:
      operationId: getConstructionBuilding
      tags: [Construction]
      parameters:
        - name: eid
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{1,40}$" }
      responses:
        "200":
          description: Cadastre attributes with labels and the number of ETN sale/rental agreements in the building.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionBuilding" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/sales/transactions/{id}:
    get:
      operationId: getSaleTransaction
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Sale package, component properties, geography, and quality evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleTransactionDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sales/transactions/{id}/context:
    get:
      operationId: getSaleTransactionContext
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Ranked same-building comparables, same-year market benchmarks, quality evidence, and valuation context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionContext"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rentals/transactions/{id}:
    get:
      operationId: getRentalTransaction
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Rental package, component spaces, geography, and quality evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalTransactionDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rentals/transactions/{id}/context:
    get:
      operationId: getRentalTransactionContext
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Ranked same-building comparables, same-year market benchmarks, quality evidence, and valuation context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionContext"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/statistics/distribution:
    get:
      operationId: getSaleDistribution
      tags: [Statistics]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/LandScope"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: metric
          in: query
          schema: {type: string, enum: [price, pricePerSqm], default: pricePerSqm}
        - $ref: "#/components/parameters/HistogramBins"
      responses:
        "200":
          description: Representative sale percentiles and p01-p99 histogram.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distribution"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rentals/statistics/distribution:
    get:
      operationId: getRentalDistribution
      tags: [Rental Statistics]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: metric
          in: query
          schema: {type: string, enum: [monthlyRent, rentPerSqm], default: rentPerSqm}
        - $ref: "#/components/parameters/HistogramBins"
      responses:
        "200":
          description: Representative rental percentiles and p01-p99 histogram.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distribution"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/buildings/search:
    get:
      operationId: searchBuildings
      tags: [Buildings]
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 3, maxLength: 120}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 20, default: 10}
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: >-
            Buildings matching an address or cadastral identity. Matching ignores case and
            diacritics, expands "c."/"ul.", and reads "15A"/"15 a". Only buildings with a recorded
            sale or rental are known. A suffixed number ("15A") matches the parts registered with
            that suffix; when only the bare number is registered, matchType stays "address" and the
            items carry the bare number (or the suffix their other parts use, as on the building page).
            When the house number has no such building, matchType is "nearest" and items are the
            nearest numbers on the street. Register notes ("k.o. Bežigrad") and misspelt duplicates of
            a busier street are not listed in streets.
          content:
            application/json:
              schema:
                type: object
                required: [items, count, matchType, requestedHouseNumber, streets, settlements]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [cadastralMunicipalityCode, buildingNumber, settlement, street, houseNumber,
                        houseNumberSuffix, longitude, latitude, saleCount, rentalCount, saleCounts, rentalCounts]
                      properties:
                        cadastralMunicipalityCode: {type: integer}
                        buildingNumber: {type: string}
                        settlement: {type: [string, "null"]}
                        street: {type: [string, "null"]}
                        houseNumber: {type: [string, "null"]}
                        houseNumberSuffix: {type: [string, "null"]}
                        longitude: {type: number}
                        latitude: {type: number}
                        saleCount: {type: integer}
                        rentalCount: {type: integer}
                        saleCounts:
                          type: object
                          additionalProperties: {type: integer}
                        rentalCounts:
                          type: object
                          additionalProperties: {type: integer}
                  count: {type: integer}
                  matchType:
                    type: string
                    enum: [address, nearest, street, cadastral, none]
                  requestedHouseNumber:
                    type: [string, "null"]
                    description: House number read from the query ("100", "15a").
                  streets:
                    type: array
                    description: Streets the query names (busiest first, at most three).
                    items:
                      type: object
                      required: [street, settlement, municipalityId, buildingCount, saleCount, rentalCount]
                      properties:
                        street:
                          type: string
                          description: Most common registered spelling; empty for a rural settlement address.
                        settlement: {type: string}
                        municipalityId: {type: [integer, "null"], format: int64}
                        buildingCount: {type: integer}
                        saleCount: {type: integer}
                        rentalCount: {type: integer}
                  settlements:
                    type: array
                    description: Settlements (naselja) named by a query without a house number (at most five).
                    items:
                      type: object
                      required: [id, name, municipalityId, municipality]
                      properties:
                        id: {type: integer, format: int64}
                        name: {type: string}
                        municipalityId: {type: [integer, "null"], format: int64}
                        municipality: {type: string}
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/buildings/{cadastralCode}/{buildingNumber}/statistics:
    get:
      operationId: getBuildingStatistics
      tags: [Buildings]
      parameters:
        - name: cadastralCode
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: buildingNumber
          in: path
          required: true
          schema: {type: string, maxLength: 100}
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
      responses:
        "200":
          description: Sale and rental history for one cadastral building identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingStatistics"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/map/clusters:
    get:
      operationId: getSaleMapClusters
      tags: [Map]
      parameters:
        - $ref: "#/components/parameters/BoundingBox"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/LandScope"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: zoom
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 22
            default: 8
      responses:
        "200":
          description: Zoom-dependent sale clusters inside the required bounding box.
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/GeoJSONFeatureCollection"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/map/properties:
    get:
      operationId: getSaleMapProperties
      tags: [Map]
      parameters:
        - $ref: "#/components/parameters/BoundingBox"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/LandScope"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 250
      responses:
        "200":
          description: Capped individual sale points inside the required bounding box.
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/GeoJSONFeatureCollection"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/map/geographies:
    get:
      operationId: getSaleMapGeographies
      tags: [Map]
      parameters:
        - $ref: "#/components/parameters/BoundingBox"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/PropertyGroup"
        - $ref: "#/components/parameters/MinArea"
        - $ref: "#/components/parameters/MaxArea"
        - $ref: "#/components/parameters/LandScope"
        - $ref: "#/components/parameters/StatisticsGeographyId"
        - name: level
          in: query
          required: true
          schema: {type: string, enum: [country, statistical_region, municipality, city_district, local_community, settlement]}
      description: At most 1200 units are returned, the most active first.
      responses:
        "200":
          description: Sale summaries grouped by named geography.
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/GeoJSONFeatureCollection"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/anomalies:
    get:
      operationId: listAnomalySignals
      tags: [Anomalies]
      parameters:
        - name: transactionKind
          in: query
          schema: {type: string, enum: [sale, rent]}
        - name: flag
          in: query
          schema: {type: string}
        - name: reviewStatus
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
        - name: minimumScore
          in: query
          schema: {type: number, minimum: 0, maximum: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        "200":
          description: Ranked anomaly signals (read-only; reviews are not recorded through the API).
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/anomalies/summary:
    get:
      operationId: getAnomalySummary
      tags: [Anomalies]
      parameters:
        - name: transactionKind
          in: query
          schema: {type: string, enum: [sale, rent]}
      responses:
        "200":
          description: Counts by anomaly and review state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalySummary"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/indices:
    get:
      operationId: listMarketIndices
      tags: [Models]
      parameters:
        - name: transactionKind
          in: query
          schema: {type: string, enum: [sale, rent]}
        - name: method
          in: query
          schema: {type: string, enum: [matched_pair_median, hedonic]}
        - name: propertyGroup
          in: query
          schema:
            $ref: "#/components/schemas/PropertyGroup"
      responses:
        "200":
          description: >
            Latest national matched-pair median and constant-quality hedonic
            index vintages, including samples, uncertainty, and publication status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketIndexList"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/valuations/{kind}/{id}:
    get:
      operationId: getTransactionValuation
      tags: [Models]
      parameters:
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [sale, rent]}
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Cross-fitted hedonic estimate and empirical range for an eligible transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuationPrediction"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    HistogramBins:
      name: bins
      in: query
      schema: {type: integer, minimum: 5, maximum: 100, default: 20}
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        not:
          const: 0
    GeographyId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    GeographyLevel:
      name: level
      in: query
      schema:
        $ref: "#/components/schemas/GeographyLevel"
    FromDate:
      name: from
      in: query
      description: Inclusive contract-date lower bound.
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      description: Inclusive contract-date upper bound.
      schema:
        type: string
        format: date
    Interval:
      name: interval
      in: query
      required: true
      schema:
        type: string
        enum: [month, quarter, year]
    PropertyGroup:
      name: propertyGroup
      in: query
      schema:
        $ref: "#/components/schemas/PropertyGroup"
    MinArea:
      name: minArea
      in: query
      description: Inclusive minimum analytical property area in square metres.
      schema: {type: number, exclusiveMinimum: 0, maximum: 1000000}
    MaxArea:
      name: maxArea
      in: query
      description: Inclusive maximum analytical property area in square metres.
      schema: {type: number, exclusiveMinimum: 0, maximum: 1000000}
    LandScope:
      name: landScope
      in: query
      description: >
        Land browsing population. Defaults to verified-buildable ETN codes 1/2.
        agricultural requires only codes 7/8; forest only 9; unverified only 3.
        mixed contains contracts spanning these categories, including known plus
        unknown use. other contains only other/unknown uses (4/5/6/10, missing or
        unrecognized codes), or missing land facts. No package price is apportioned
        between land types. all includes every land sale; broad preserves the
        legacy 1-3 population. Model training remains strict regardless of browsing.
        It has no effect unless propertyGroup is land.
      schema:
        type: string
        enum: [strict, broad, all, agricultural, forest, unverified, mixed, other]
        default: strict
    StatisticsGeographyId:
      name: geographyId
      in: query
      description: Official geographic unit at any supported hierarchy level.
      schema:
        type: integer
        format: int64
        minimum: 1
    BoundingBox:
      name: bbox
      in: query
      required: true
      description: WGS84 west,south,east,north coordinates.
      schema:
        type: string
        pattern: '^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$'
  responses:
    Error:
      description: API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      required: [status, application, build, environment]
      properties:
        status:
          type: string
          const: ok
        application:
          type: string
        build:
          type: string
        environment:
          type: string
    Metadata:
      type: object
      required: [apiVersion, transactionKinds, intervals, geographyLevels, propertyGroups]
      properties:
        apiVersion:
          type: string
        transactionKinds:
          type: array
          items:
            type: string
            enum: [sale, rent]
        intervals:
          type: array
          items:
            type: string
            enum: [month, quarter, year]
        geographyLevels:
          type: array
          items:
            $ref: "#/components/schemas/GeographyLevel"
        propertyGroups:
          type: array
          items:
            type: string
            enum: [apartment, house, land, commercial, garage, room, mixed, unknown]
    DataStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [current, processing, failed]
        activeRelease:
          $ref: "#/components/schemas/AnalyticalRelease"
        pendingRelease:
          $ref: "#/components/schemas/AnalyticalRelease"
        lastFailedRelease:
          $ref: "#/components/schemas/AnalyticalRelease"
    AnalyticalRelease:
      type: object
      required: [id, status, stage, startedAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [processing, published, failed]}
        stage: {type: string}
        sourceSaleThrough: {type: string, format: date-time}
        sourceRentThrough: {type: string, format: date-time}
        analyticsSaleThrough: {type: string, format: date-time}
        analyticsRentThrough: {type: string, format: date-time}
        modelVersions: {type: string}
        startedAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time}
    GeographyLevel:
      type: string
      enum: [country, statistical_region, municipality, city_district, local_community, settlement]
    PropertyGroup:
      type: string
      enum: [apartment, house, land, commercial, garage, room, mixed, unknown]
    Geography:
      type: object
      required: [id, level, name, gursEid]
      properties:
        id:
          type: integer
          format: int64
        level:
          $ref: "#/components/schemas/GeographyLevel"
        code:
          type: integer
        compositeCode:
          type: integer
        name:
          type: string
        parentId:
          type: integer
          format: int64
        gursEid:
          type: string
        bounds:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: WGS84 bounding box ordered west, south, east, north.
    GeographyList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Geography"
        count:
          type: integer
          minimum: 0
    GeoJSONFeature:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: integer
          format: int64
        properties:
          $ref: "#/components/schemas/Geography"
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon]
            coordinates: {}
    StatisticsOverview:
      type: object
      required:
        - transactionCount
        - eligibleCount
        - includedSampleSize
        - excludedOutlierCount
        - priceSampleSize
        - pricePerSqmSampleSize
        - isPublishable
      properties:
        transactionCount:
          type: integer
          format: int64
        eligibleCount:
          type: integer
          format: int64
        includedSampleSize:
          type: integer
          format: int64
        excludedOutlierCount:
          type: integer
          format: int64
        priceSampleSize:
          type: integer
          format: int64
        pricePerSqmSampleSize:
          type: integer
          format: int64
        medianPrice:
          type: [number, "null"]
        cleanedAveragePrice:
          type: [number, "null"]
        rawAveragePrice:
          type: [number, "null"]
        medianPricePerSqm:
          type: [number, "null"]
        cleanedAveragePricePerSqm:
          type: [number, "null"]
        rawAveragePricePerSqm:
          type: [number, "null"]
        medianArea:
          type: [number, "null"]
        isPublishable: {type: boolean}
        suppressionReason: {type: [string, "null"]}
    StatisticsTimeSeriesPoint:
      allOf:
        - $ref: "#/components/schemas/StatisticsOverview"
        - type: object
          required: [period, incomplete]
          properties:
            period:
              type: string
              format: date
            incomplete:
              type: boolean
    StatisticsTimeSeries:
      type: object
      required: [interval, items, count]
      properties:
        interval:
          type: string
          enum: [month, quarter, year]
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatisticsTimeSeriesPoint"
        count:
          type: integer
          minimum: 0
    InflationPoint:
      type: object
      required: [period, annualRatePercent]
      properties:
        period: {type: string, format: date}
        annualRatePercent: {type: number}
    InflationSeries:
      type: object
      required: [items, count, source]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InflationPoint"
        count: {type: integer, minimum: 0}
        source: {type: string, const: "SURS SiStat H281S"}
    RentalStatisticsOverview:
      type: object
      required:
        - transactionCount
        - eligibleCount
        - includedSampleSize
        - excludedOutlierCount
        - monthlyRentSampleSize
        - rentPerSqmSampleSize
        - isPublishable
      properties:
        transactionCount: {type: integer, format: int64}
        eligibleCount: {type: integer, format: int64}
        includedSampleSize: {type: integer, format: int64}
        excludedOutlierCount: {type: integer, format: int64}
        monthlyRentSampleSize: {type: integer, format: int64}
        rentPerSqmSampleSize: {type: integer, format: int64}
        medianMonthlyRent: {type: [number, "null"]}
