name: Tests

# Pull requests run on their merge ref; pushes only on main, so a PR branch never runs twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://real_estate:real_estate@localhost:5432/real_estate

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: real_estate
          POSTGRES_USER: real_estate
          POSTGRES_PASSWORD: real_estate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U real_estate -d real_estate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/data-pipeline/pyproject.toml
      - run: pip install -e ".[dev,ml]"
        working-directory: apps/data-pipeline
      - run: ruff check .
        working-directory: apps/data-pipeline
      # Python publication integration tests require the same migrated schema as Go.
      - name: Apply database migrations
        run: |
          for migration in database/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run pipeline unit and integration tests
        run: pytest -q
        working-directory: apps/data-pipeline
      # Dependencies are version ranges without a lock file: report, do not block.
      - name: Audit Python dependencies (advisory)
        continue-on-error: true
        run: pip install pip-audit && pip-audit --skip-editable
        working-directory: apps/data-pipeline

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: real_estate
          POSTGRES_USER: real_estate
          POSTGRES_PASSWORD: real_estate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U real_estate -d real_estate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/real-estate-api
    steps:
      - uses: actions/checkout@v4
      - name: Apply database migrations
        working-directory: .
        run: |
          for migration in database/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/real-estate-api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go build ./...
      - run: go test -race ./...

  observer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/observer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Generated API contract is current
        run: npm run generate:api-types && git diff --exit-code -- src/generated/api-schema.d.ts
      - run: npm run typecheck
      - name: Unit tests (incl. i18n audit)
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # The production bundle is built once, inside the image, by the compose job.

  compose:
    needs: [pipeline, api, observer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose services
        run: docker compose config --quiet
      - name: Build all images once
        run: docker compose build
      - name: nginx configuration
        run: docker run --rm --add-host real-estate-api:127.0.0.1 real-estate-observer:development nginx -t
      - name: Fresh Compose startup and migration retry (no import or training)
        run: python infrastructure/docker/smoke.py

  images:
    needs: compose
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: apps/real-estate-api
            file: apps/real-estate-api/Dockerfile
          - image: observer
            context: apps/observer
            file: apps/observer/Dockerfile
          - image: pipeline
            context: apps/data-pipeline
            file: apps/data-pipeline/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/matkopolo/nepremicninskiagent-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
