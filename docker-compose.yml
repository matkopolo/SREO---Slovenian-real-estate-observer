services:
  db:
    build:
      context: .
      dockerfile: infrastructure/docker/database/Dockerfile
    image: real-estate-postgis:16
    pull_policy: build
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: real_estate
      POSTGRES_PASSWORD: real_estate
    ports:
      - "5432:5432"
    mem_limit: 4g
    shm_size: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U real_estate -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 10

  database-migrations:
    # Official PostgreSQL client base; no host shell or bind mounts required.
    build:
      context: .
      dockerfile: infrastructure/docker/migrations/compose.Dockerfile
    image: real-estate-compose-migrations:16
    pull_policy: build
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  real-estate-api:
    build:
      context: ./apps/real-estate-api
      dockerfile: Dockerfile
    image: real-estate-api:development
    pull_policy: build
    environment:
      API_ENV: development
      API_BUILD: local
      API_ADDRESS: ":8080"
      API_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      DATABASE_URL: postgresql://real_estate_api:real_estate_api@db:5432/real_estate
      DATABASE_MAX_CONNECTIONS: 10
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      database-migrations:
        condition: service_completed_successfully
      pipeline-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  pipeline-worker:
    build:
      context: ./apps/data-pipeline
      dockerfile: Dockerfile
    image: real-estate-data-pipeline:development
    pull_policy: build
    command:
      - schedule
      - --interval-days
      - "${REFRESH_INTERVAL_DAYS:-14}"
      - --retry-hours
      - "${REFRESH_RETRY_HOURS:-1}"
      - --output-dir
      - /data/raw
      - --health-file
      - /tmp/pipeline-healthy
    environment:
      DATABASE_URL: postgresql://real_estate:real_estate@db:5432/real_estate
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANALYTICS_PROGRESS_INTERVAL_SECONDS: ${ANALYTICS_PROGRESS_INTERVAL_SECONDS:-15}
      MODEL_DETAILED_PROGRESS: ${MODEL_DETAILED_PROGRESS:-false}
    init: true
    mem_limit: 3g
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - pipeline_data:/data
    depends_on:
      db:
        condition: service_healthy
      database-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(not Path('/tmp/pipeline-healthy').is_file())"]
      interval: 30s
      timeout: 5s
      retries: 240
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    image: real-estate-web:development
    pull_policy: build
    environment:
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    mem_limit: 768m
    depends_on:
      real-estate-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  atlas:
    # DOMOGLASNIK Atlas: separate three.js/WebGL site on the same API (http://localhost:3100).
    build:
      context: ./apps/atlas
      dockerfile: Dockerfile
    image: real-estate-atlas:development
    pull_policy: build
    ports:
      - "3100:80"
    mem_limit: 128m
    depends_on:
      real-estate-api:
        condition: service_healthy

volumes:
  postgres_data:
  pipeline_data:
