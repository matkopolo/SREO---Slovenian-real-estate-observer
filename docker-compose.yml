# Fixed project name: volumes stay real_estate_postgres_data / real_estate_pipeline_data
# whatever the checkout folder is called.
name: real_estate

services:
  db:
    build:
      context: .
      dockerfile: infrastructure/docker/database/Dockerfile
    image: real-estate-postgis:16
    pull_policy: build
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: real_estate
      POSTGRES_PASSWORD: real_estate
    # Development superuser: published on loopback only.
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    mem_limit: 4g
    shm_size: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U real_estate -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 10

  database-migrations:
    # Official PostgreSQL client base; no host shell or bind mounts required.
    build:
      context: .
      dockerfile: infrastructure/docker/migrations/compose.Dockerfile
    image: real-estate-compose-migrations:16
    pull_policy: build
    environment:
      # Login password the runner sets on the least-privilege real_estate_pipeline role.
      PIPELINE_DATABASE_PASSWORD: ${PIPELINE_DATABASE_PASSWORD:-real_estate_pipeline}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  real-estate-api:
    build:
      context: ./apps/real-estate-api
      dockerfile: Dockerfile
    image: real-estate-api:development
    pull_policy: build
    environment:
      API_ENV: development
      API_BUILD: local
      API_ADDRESS: ":8080"
      # Only the Vite dev server is cross-origin; the observer proxies /api/ same-origin.
      API_ALLOWED_ORIGINS: "http://localhost:5174"
      DATABASE_URL: postgresql://real_estate_api:real_estate_api@db:5432/real_estate
      DATABASE_MAX_CONNECTIONS: 10
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 512m
    restart: unless-stopped
    # Not gated on the pipeline: atomic publication means the API always serves the
    # last published release, and /api/v1/data-status reports when data is missing or stale.
    depends_on:
      db:
        condition: service_healthy
      database-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  pipeline-worker:
    build:
      context: ./apps/data-pipeline
      dockerfile: Dockerfile
    image: real-estate-data-pipeline:development
    pull_policy: build
    command:
      - schedule
      - --interval-days
      - "${REFRESH_INTERVAL_DAYS:-14}"
      - --retry-hours
      - "${REFRESH_RETRY_HOURS:-1}"
      - --output-dir
      - /data/raw
      - --health-file
      - /tmp/pipeline-healthy
    environment:
      # Least-privilege role (045_pipeline_least_privilege.sql); refresh functions run as
      # SECURITY DEFINER. Destructive admin commands use the superuser (see Makefile).
      DATABASE_URL: postgresql://real_estate_pipeline:${PIPELINE_DATABASE_PASSWORD:-real_estate_pipeline}@db:5432/real_estate
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANALYTICS_PROGRESS_INTERVAL_SECONDS: ${ANALYTICS_PROGRESS_INTERVAL_SECONDS:-15}
      MODEL_DETAILED_PROGRESS: ${MODEL_DETAILED_PROGRESS:-false}
      MODEL_REFRESH_POLICY: ${MODEL_REFRESH_POLICY:-auto}
    init: true
    mem_limit: 3g
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - pipeline_data:/data
    depends_on:
      db:
        condition: service_healthy
      database-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(not Path('/tmp/pipeline-healthy').is_file())"]
      interval: 30s
      timeout: 5s
      retries: 240
      start_period: 10s

  observer:
    # SREO web frontend (React + MapLibre, served by nginx, which proxies same-origin /api/* to the API).
    # http://localhost:3000; :3100 keeps earlier links working.
    build:
      context: ./apps/observer
      dockerfile: Dockerfile
    image: real-estate-observer:development
    pull_policy: build
    ports:
      - "127.0.0.1:3000:80"
      - "127.0.0.1:3100:80"
    mem_limit: 128m
    restart: unless-stopped
    # nginx resolves the API per request, so the frontend can start before the API is ready.
    depends_on:
      db:
        condition: service_healthy
      database-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  pipeline_data:
